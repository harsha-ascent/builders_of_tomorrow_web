<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Builders of Tomorrow">
  <!-- rounded navy tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#1e2a4a"/>
  <!-- ground line -->
  <rect x="10" y="50" width="44" height="4" rx="2" fill="#6bcb77"/>
  <!-- stacked building blocks: a tower being built -->
  <rect x="12" y="36" width="16" height="14" rx="3" fill="#4cc9f0"/>
  <rect x="30" y="36" width="16" height="14" rx="3" fill="#ffd93d"/>
  <rect x="21" y="22" width="16" height="14" rx="3" fill="#ff6b6b"/>
  <!-- block studs -->
  <circle cx="20" cy="43" r="2.2" fill="#ffffff" opacity=".85"/>
  <circle cx="38" cy="43" r="2.2" fill="#1e2a4a" opacity=".55"/>
  <circle cx="29" cy="29" r="2.2" fill="#ffffff" opacity=".85"/>
  <!-- the next block, lifted into place -->
  <rect x="38" y="12" width="12" height="10" rx="2.5" fill="#845ec2" transform="rotate(-12 44 17)"/>
  <!-- sparkle -->
  <path d="M14 14l1.6 3.4L19 19l-3.4 1.6L14 24l-1.6-3.4L9 19l3.4-1.6z" fill="#ffd93d"/>
</svg>
